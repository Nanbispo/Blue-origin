<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Blue Origin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <head>
        <main>
            <header>
                <nav class="barra_superior">
                    <img class="blue_origin" src="imgs/logo-blue-origin-tagline-optimized 1.svg" alt="Logo blue Origin">
                    <ul class="barra_superior_opcoes">
                        <li class="lista_elemento"> <a href="#">Vehicles</a></li>
                        <li class="lista_elemento"> <a href="#">System</a></li>
                        <li class="lista_elemento"> <a href="#">About</a></li>
                        <li class="lista_elemento"> <a href="#">Carrers</a></li>
                        <li class="lista_elemento"> <a href="#">Shop</a></li>
                        <div class="barra_inferior"></div>
                    </ul>
                        <div class="menu_direita">
                            <button class="botao_superior">Compre seu Assento</button>
                            <img src="imgs/hamburger.png" alt="" class="hamburger">
                        </div>
                </nav>
            </header>

            <section class="banner_planeta">
                <h2>Junte-se a uma nova geração de astronautas.</h2>
                <button class="botao_central">Descubra Mais</button>
                <img src="imgs/Mask group.svg" alt="" class="planeta">
                <svg xmlns="http://www.w3.org/2000/svg" width="160" height="10" viewBox="0 0 160 10" fill="none">
                    <rect width="40" height="10" fill="#D9D9D9"/>
                    <rect x="60" width="40" height="10" fill="#D9D9D9"/>
                    <rect x="120" width="40" height="10" fill="#D9D9D9"/>
                    </svg>
            </section>

            <section id="conteudo"></section>
            <section id="carreiras"></section>
            <footer></footer>
        
        </main>
    </head>
    <script src="app/app.js"></script>
</body>
</html>
